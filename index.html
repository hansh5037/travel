<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>여행 일정</title>
	<link rel="stylesheet" href="./common/css.css">
</head>
<body>
	<style>
		.headline {
			font-size: 24px;
			text-align: center;
		}
		.project-list {
			margin-top: 30px;
		}
		.project-item {
			display: block;
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 16px;
			margin-bottom: 12px;
			cursor: pointer;
		}
		.project-title {
			font-size: 18px;
		}
		.project-date {
			color: #999;
		}
	</style>

	<div class="headline">✈️ 여행 일정</div>

	<ul class="project-list">
		<li>
			<a class="project-item" href="./project/2026_osaka/">
				<div class="project-title">🇯🇵 2026 오사카 여행</div>
				<div class="project-date">2026</div>
			</a>
		</li>
	</ul>
</body>
</html>
