<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2026 오사카 여행</title>
	<link rel="stylesheet" href="../../common/common.css">
	<link rel="stylesheet" href="../2026_osaka/css/style.css">
</head>

<body>
	<div class="common-inner">
		<h1 class="headline">2026 오사카 여행🏯</h1>
		<div class="info">
			<div class="info-box">
				<div class="info-icon">📅</div>
				<div class="info-text">기간</div>
				<div class="info-text">2026.08.14 ~ 18</div>
				<div class="info-desc">(4박 5일)</div>
			</div>
			<div class="info-box">
				<div class="info-icon">📍</div>
				<div class="info-text">장소</div>
				<div class="info-text">오사카, 교토</div>
			</div>
			<div class="info-box">
				<div class="info-icon">💵</div>
				<div class="info-text">budget</div>
				<div class="info-text">1,300,000원</div>
				<div class="info-desc">(1인당)</div>
			</div>
			<div class="info-box">
				<div class="info-icon">💸</div>
				<div class="info-text">Total cost</div>
				<div class="info-text"><span class="total"></span>원</div>
				<div class="info-desc">(1인당)</div>
			</div>
		</div>
		<div class="schedule">
			<ul role="tablist" class="tab tab-bg">
				<li role="tab" class="tab-list is-active">
					<button type="button" id="tabButton1" class="tab-button" aria-selected="true">
						<span class="tab-icon">1</span>
						<span class="tab-text">DAY</span>
					</button>
				</li>
				<li role="tab" class="tab-list">
					<button type="button" id="tabButton2" class="tab-button" aria-selected="false">
						<span class="tab-icon">2</span>
						<span class="tab-text">DAY</span>
					</button>
				</li>
				<li role="tab" class="tab-list">
					<button type="button" id="tabButton3" class="tab-button" aria-selected="false">
						<span class="tab-icon">3</span>
						<span class="tab-text">DAY</span>
					</button>
				</li>
				<li role="tab" class="tab-list">
					<button type="button" id="tabButton4" class="tab-button" aria-selected="false">
						<span class="tab-icon">4</span>
						<span class="tab-text">DAY</span>
					</button>
				</li>
				<li role="tab" class="tab-list">
					<button type="button" id="tabButton5" class="tab-button" aria-selected="false">
						<span class="tab-icon">5</span>
						<span class="tab-text">DAY</span>
					</button>
				</li>
			</ul>
			<div class="tabpanel-wrap">
				<div role="tabpanel" aria-labelledby="tabButton1" class="tabpanel"
					data-include="partials/day1.html"></div>
				<div role="tabpanel" aria-labelledby="tabButton2" class="tabpanel"
					data-include="partials/day2.html"></div>
				<div role="tabpanel" aria-labelledby="tabButton3" class="tabpanel"
					data-include="partials/day3.html"></div>
				<div role="tabpanel" aria-labelledby="tabButton4" class="tabpanel"
					data-include="partials/day4.html"></div>
				<div role="tabpanel" aria-labelledby="tabButton5" class="tabpanel"
					data-include="partials/day5.html"></div>
			</div>
			<div class="today-cost">
				<button type="button" class="today-cost-button">
					<span class="today-cost-arrow"></span>
					<div class="today-cost-text">
						<span>오늘 사용금액</span>
						<span class="today-total-cost"></span>
					</div>
					<div class="today-cost-text-2">상세 보기 ></div>
				</button>
				<div class="today-cost-body">
					<div class="today-cost-body__inner">
						<ol role="list" class="today-cost-list">
						</ol>
						<div class="today-cost-form">
							<input type="text" class="today-cost-form__desc" placeholder="사용 내역">
							<input type="number" class="today-cost-form__price" placeholder="금액" min="0">
							<button type="button" class="today-cost-form__add">추가</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="../../common/include.js"></script>
	<script src="../2026_osaka/js/sheets-config.js"></script>
	<script src="../2026_osaka/js/script.js"></script>
</body>

</html>
